name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: python scripts/check_docs.py
      - run: pytest --cov=fastapi_xxljob --cov-report=term-missing --cov-fail-under=90

  fastapi-compatibility:
    name: FastAPI ${{ matrix.fastapi-label }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            fastapi-spec: "fastapi==0.124.4"
            fastapi-label: "0.124.4"
          - python-version: "3.9"
            fastapi-spec: "fastapi==0.125.0"
            fastapi-label: "0.125.0"
          - python-version: "3.10"
            fastapi-spec: "fastapi>=0.124.4,<1.0"
            fastapi-label: "latest"
          - python-version: "3.11"
            fastapi-spec: "fastapi>=0.124.4,<1.0"
            fastapi-label: "latest"
          - python-version: "3.12"
            fastapi-spec: "fastapi>=0.124.4,<1.0"
            fastapi-label: "latest"
          - python-version: "3.13"
            fastapi-spec: "fastapi>=0.124.4,<1.0"
            fastapi-label: "latest"
          - python-version: "3.14"
            fastapi-spec: "fastapi>=0.124.4,<1.0"
            fastapi-label: "latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]" "${{ matrix.fastapi-spec }}"
      - run: python -m pip check
      - run: python -c "import fastapi; print('FastAPI', fastapi.__version__)"
      - run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_package.py --dist-dir dist
